server:
  port: 8080

spring:
  application:
    name: booking-system

  datasource:
    url: jdbc:h2:file:./data/bookingdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    # Base64-encoded secret. In production this MUST come from an environment
    # variable / secrets manager, never committed to source control.
    secret: ${JWT_SECRET:c2VjcmV0LWtleS1mb3ItYm9va2luZy1zeXN0ZW0tYXNzaWdubWVudC1kZW1vLTEyMzQ1Njc4OTA=}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour

logging:
  level:
    com.assignment.booking: INFO
    org.springframework.security: WARN
